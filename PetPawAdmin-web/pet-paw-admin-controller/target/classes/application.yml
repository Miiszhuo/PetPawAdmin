server:
  port: 6784

spring:
  application:
    name: petpaw-admin-web

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/petpaw_admin?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s

  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.petpaw.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.petpaw: debug
    org.springframework.web: debug
    org.springframework.security: debug
    # 减少MyBatis的详细日志
    org.apache.ibatis: warn
    java.sql: warn

# JWT配置
jwt:
  secret: petpaw-admin-secret-key-2024-12-25-very-long-secret-key-for-jwt-token-generation
  expire-time: 86400000  # 24小时

# 文件上传配置
file:
  upload:
    max-size: 10MB
    path: ./uploads/

# 阿里云 OSS 配置
aliyun:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    access-key-id: LTAI5tJpDjxLWmg6egiLGd1v
    access-key-secret: Gr4FSrgjkmBLou36L2erLpxjsRFS6w
    bucket-name: image-tww
